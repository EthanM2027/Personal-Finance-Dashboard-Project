{% extends "base.html" %} {% block content %}
<h1>Add New Transaction</h1>

<form method="POST">
  <div class="form-group">
    <label for="account_id">Account: *</label>
    <select name="account_id" id="account_id" required>
      <option value="">-- Select Account --</option>
      {% for acc_id, name, acc_type, balance in accounts %}
      <option value="{{ acc_id }}">
        {{ name }} ({{ acc_type }}) - Balance: ${{ "%.2f"|format(balance) }}
      </option>
      {% endfor %}
    </select>
    <small>Which account is this transaction for?</small>
  </div>

  <div class="form-group">
    <label for="amount">Amount: *</label>
    <input
      type="number"
      step="0.01"
      name="amount"
      id="amount"
      placeholder="0.00"
      required
    />
    <small>Use positive numbers for income, negative for expenses</small>
  </div>

  <div class="form-group">
    <label for="category_id">Category: *</label>
    <select name="category_id" id="category_id" required>
      <option value="">-- Select Category --</option>
      {% for cat_id, name, cat_type in categories %}
      <option value="{{ cat_id }}">{{ name }} ({{ cat_type }})</option>
      {% endfor %}
    </select>
    <small>What type of transaction is this?</small>
  </div>

  <div class="form-group">
    <label for="date">Date: *</label>
    <input type="date" name="date" id="date" value="{{ today }}" required />
    <small>When did this transaction occur?</small>
  </div>

  <div class="form-group">
    <label for="description">Description: *</label>
    <input
      type="text"
      name="description"
      id="description"
      placeholder="e.g., Weekly grocery shopping"
      required
      maxlength="200"
    />
    <small>Brief description of the transaction</small>
  </div>

  <div style="margin-top: 30px; display: flex; gap: 10px">
    <button type="submit" class="btn">Add Transaction</button>
    <a href="/" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
